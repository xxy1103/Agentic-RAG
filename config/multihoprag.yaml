paths:
  corpus_dir: data/multihoprag/raw
  index_dir: data/multihoprag/index
  runs_dir: runs/multihoprag

multihoprag:
  dataset_dir: data/multihoprag

models:
  api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
  embedding_model: qwen3.7-text-embedding
  embedding_dimensions: 1024
  llm_model: qwen3.7-plus
  timeout_seconds: 60
  max_retries: 3
  retry_delay_seconds: 5

ingestion:
  allowed_extensions: [".md"]
  chunk_size: 1000
  chunk_overlap: 150
  embedding_batch_size: 16
  fail_on_error: true

retrieval:
  top_k: 10
  min_score: 0.25
  max_context_characters: 9000
  dense_candidate_k: 20
  sparse_candidate_k: 20
  fusion_candidate_k: 30
  rrf_k: 60

query_rewrite:
  enabled: true
  max_tokens: 400
  language: en

reranker:
  enabled: true
  model: qwen3-rerank
  top_n: 10
  instruct: "Given a multi-hop question, retrieve passages that jointly provide all required evidence."

generation:
  temperature: 0.1
  max_tokens: 1200

runtime:
  save_runs: true
  default_profile: advanced

evaluation:
  concurrency: 4
