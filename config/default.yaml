paths:
  corpus_dir: data/raw
  index_dir: data/index
  runs_dir: runs

models:
  api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
  embedding_model: qwen3.7-text-embedding
  embedding_dimensions: 1024
  llm_model: qwen3.7-plus
  timeout_seconds: 60
  max_retries: 3
  retry_delay_seconds: 5

ingestion:
  allowed_extensions: [".pdf", ".md", ".mdx", ".html", ".htm"]
  chunk_size: 1000
  chunk_overlap: 150
  embedding_batch_size: 16
  fail_on_error: true

retrieval:
  top_k: 6
  min_score: 0.25
  max_context_characters: 9000
  dense_candidate_k: 20
  sparse_candidate_k: 20
  fusion_candidate_k: 30
  rrf_k: 60

query_rewrite:
  enabled: true
  max_tokens: 400
  language: zh

reranker:
  enabled: true
  model: qwen3-rerank
  top_n: 6
  instruct: "Given a web search query, retrieve relevant passages that answer the query."

generation:
  temperature: 0.1
  max_tokens: 1200

runtime:
  save_runs: true
  default_profile: advanced

evaluation:
  concurrency: 4

agentic:
  base_profile: hybrid-rerank
  max_hops: 3
  max_corrections_per_hop: 1
  structured_output_retries: 1
  recursion_limit: 25
