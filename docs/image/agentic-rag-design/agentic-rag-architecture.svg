<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">Agentic RAG Phase 3 完整架构</title>
  <desc id="desc">CLI 与配置加载模型和索引，LangGraph 编排 Router、逐跳 Phase 2 检索、Evidence Grader、下一跳、查询纠错和 Finalize，输出 AgenticRetrievalResult 与运行记录。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183153" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60758e"/></marker>
    <style>.title{font:700 30px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.subtitle{font:400 15px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#58708f}.lane{font:700 16px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#294462}.h2{font:700 16px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.body{font:400 14px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#4c6078}.small{font:400 12px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#65788e}.code{font:600 14px Consolas,"Microsoft YaHei",sans-serif;fill:#29465f}.arrow{stroke:#60758e;stroke-width:2.4;fill:none;marker-end:url(#arrow)}.edge{stroke:#60758e;stroke-width:2;fill:none;marker-end:url(#arrow)}.error{stroke:#bb6b62;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1280" height="900" rx="24" fill="#f5f8fc"/>
  <text x="54" y="58" class="title">Phase 2 提供检索工具，Phase 3 提供有界的证据决策循环</text>
  <text x="54" y="88" class="subtitle">LLM 生成结构化控制信号；确定性校验、完成门控和预算共同限制错误与无限循环。</text>

  <rect x="42" y="116" width="1196" height="112" rx="20" fill="#fff" opacity=".95"/>
  <text x="66" y="148" class="lane">入口、配置与共享资源</text>
  <rect x="76" y="170" width="238" height="42" rx="12" fill="#e8f1fb"/><text x="195" y="196" text-anchor="middle" class="code">agentic-retrieve / eval</text>
  <rect x="350" y="170" width="250" height="42" rx="12" fill="#e8f1fb"/><text x="475" y="196" text-anchor="middle" class="code">AgenticConfig</text>
  <rect x="636" y="170" width="250" height="42" rx="12" fill="#f0eafb"/><text x="761" y="196" text-anchor="middle" class="body">Generator · Embedder · Reranker</text>
  <rect x="922" y="170" width="250" height="42" rx="12" fill="#dff3e8"/><text x="1047" y="196" text-anchor="middle" class="body">FAISS + BM25 只读索引</text>

  <path d="M640 228 V266" class="arrow"/>
  <rect x="42" y="264" width="1196" height="474" rx="20" fill="#fff" opacity=".95"/>
  <text x="66" y="298" class="lane">LangGraph StateGraph · AgenticState</text>

  <rect x="76" y="332" width="208" height="86" rx="15" fill="#f0eafb" filter="url(#shadow)"/>
  <text x="180" y="362" text-anchor="middle" class="code">route_query</text><text x="180" y="386" text-anchor="middle" class="body">RouteDecision</text><text x="180" y="405" text-anchor="middle" class="small">首跳 query + requirements</text>
  <path d="M284 375 H340" class="arrow"/>

  <rect x="342" y="318" width="282" height="114" rx="16" fill="#dff3e8" stroke="#6aa281" stroke-width="2" filter="url(#shadow)"/>
  <text x="483" y="350" text-anchor="middle" class="code">retrieve_hop</text><text x="483" y="376" text-anchor="middle" class="body">Dense + BM25 → RRF → Rerank</text><text x="483" y="400" text-anchor="middle" class="small">追加新跳；纠错时替换当前跳 hits</text>
  <path d="M624 375 H680" class="arrow"/>

  <rect x="682" y="318" width="278" height="114" rx="16" fill="#f0eafb" stroke="#8b76b5" stroke-width="2" filter="url(#shadow)"/>
  <text x="821" y="350" text-anchor="middle" class="code">grade_evidence</text><text x="821" y="376" text-anchor="middle" class="body">累计 hits → 逐项 assessment</text><text x="821" y="400" text-anchor="middle" class="small">LLM 判断 + apply_complete_gate</text>
  <path d="M960 375 H1020" class="arrow"/><text x="968" y="362" class="small">complete / 预算耗尽 / grader_failed</text>

  <rect x="1022" y="332" width="180" height="86" rx="15" fill="#fff1dc" filter="url(#shadow)"/>
  <text x="1112" y="362" text-anchor="middle" class="code">finalize</text><text x="1112" y="386" text-anchor="middle" class="body">compose_final_hits</text><text x="1112" y="405" text-anchor="middle" class="small">终止原因</text>

  <rect x="510" y="522" width="224" height="86" rx="15" fill="#e8f1fb" filter="url(#shadow)"/>
  <text x="622" y="553" text-anchor="middle" class="code">prepare_next_hop</text><text x="622" y="578" text-anchor="middle" class="body">hop + 1</text><text x="622" y="598" text-anchor="middle" class="small">query = next_query</text>

  <rect x="820" y="522" width="224" height="86" rx="15" fill="#fde9e7" filter="url(#shadow)"/>
  <text x="932" y="553" text-anchor="middle" class="code">correct_query</text><text x="932" y="578" text-anchor="middle" class="body">hop 不变 · correction + 1</text><text x="932" y="598" text-anchor="middle" class="small">更具体或同义替换</text>

  <path d="M821 432 V478 H622 V520" class="arrow"/><text x="646" y="468" class="small">continue · 未达 max_hops</text>
  <path d="M862 432 V494 H932 V520" class="arrow"/><text x="878" y="486" class="small">insufficient · 有纠错预算</text>
  <path d="M622 522 V468 H483 V434" class="arrow"/>
  <path d="M932 522 V456 H542 V434" class="arrow"/>
  <path d="M180 332 V244 H1112 V330" class="error"/><text x="302" y="258" class="small">router_failed → finalize</text>
  <path d="M483 318 V306 H1088 V330" class="error"/><text x="548" y="302" class="small">retrieval_failed → finalize</text>

  <rect x="78" y="642" width="1124" height="68" rx="14" fill="#e8eef6"/>
  <text x="104" y="670" class="body">状态贯穿全图：</text><text x="230" y="670" class="code">current_hop · current_query · accumulated_hits_by_hop · requirement_assessments · traces</text>
  <text x="104" y="696" class="body">有界控制：</text><text x="200" y="696" class="code">max_hops=3 · max_corrections_per_hop=1 · recursion_limit=25</text>

  <path d="M1112 418 V770" class="arrow"/>
  <rect x="42" y="768" width="1196" height="92" rx="20" fill="#fff" opacity=".96"/>
  <text x="66" y="800" class="lane">输出与可观测性</text>
  <rect x="92" y="818" width="420" height="30" rx="9" fill="#dff3e8"/><text x="302" y="839" text-anchor="middle" class="code">AgenticRetrievalResult · final_hits + traces</text>
  <rect x="566" y="818" width="276" height="30" rx="9" fill="#fff1dc"/><text x="704" y="839" text-anchor="middle" class="code">runs/agentic/*.json</text>
  <rect x="896" y="818" width="276" height="30" rx="9" fill="#e8f1fb"/><text x="1034" y="839" text-anchor="middle" class="code">Agentic Eval + Delta</text>
</svg>
