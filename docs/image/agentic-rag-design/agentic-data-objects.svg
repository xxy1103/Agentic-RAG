<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Phase 3 新增数据对象及其关系</title>
  <desc id="desc">Router 生成需求和路由，Grader 生成需求评估和证据决策，每一跳形成 HopTrace，最终汇总为 AgenticRetrievalResult。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183153" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60758e"/></marker>
    <style>.title{font:700 30px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.subtitle{font:400 15px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#58708f}.h2{font:700 17px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#183153}.body{font:400 14px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#4c6078}.small{font:400 12px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#65788e}.code{font:600 14px Consolas,"Microsoft YaHei",sans-serif;fill:#29465f}.arrow{stroke:#60758e;stroke-width:2.4;fill:none;marker-end:url(#arrow)}.link{stroke:#9aa9ba;stroke-width:2;fill:none}</style>
  </defs>
  <rect width="1280" height="720" rx="24" fill="#f5f8fc"/>
  <text x="54" y="58" class="title">数据对象让“为什么继续、何时停止”成为可检查状态</text>
  <text x="54" y="88" class="subtitle">Phase 2 的 SearchHit 继续保存每次命中；Phase 3 在其外增加计划、验收、逐跳 Trace 与总结果。</text>

  <rect x="48" y="126" width="330" height="154" rx="18" fill="#e8f1fb" filter="url(#shadow)"/>
  <text x="72" y="158" class="code">EvidenceRequirement</text>
  <text x="72" y="190" class="body">requirement_id</text><text x="208" y="190" class="small">R1</text>
  <text x="72" y="216" class="body">description</text><text x="208" y="216" class="small">必须证明的原子事实</text>
  <text x="72" y="252" class="small">由 Router 创建，供每一轮 Grader 对齐</text>

  <rect x="458" y="126" width="356" height="154" rx="18" fill="#dff3e8" filter="url(#shadow)"/>
  <text x="482" y="158" class="code">RouteDecision</text>
  <text x="482" y="190" class="body">route</text><text x="592" y="190" class="small">single_hop / multi_hop</text>
  <text x="482" y="216" class="body">query · reason</text><text x="482" y="244" class="body">requirements[]</text>
  <path d="M458 204 H380" class="arrow"/>

  <rect x="900" y="126" width="332" height="154" rx="18" fill="#f0eafb" filter="url(#shadow)"/>
  <text x="924" y="158" class="code">RequirementAssessment</text>
  <text x="924" y="190" class="body">requirement_id</text>
  <text x="924" y="216" class="body">status</text><text x="1034" y="216" class="small">supported / missing</text>
  <text x="924" y="244" class="body">evidence_chunk_ids[]</text>

  <rect x="48" y="350" width="330" height="174" rx="18" fill="#e8eef6" filter="url(#shadow)"/>
  <text x="72" y="382" class="code">SearchHit</text>
  <text x="72" y="414" class="body">Chunk 正文与来源</text>
  <text x="72" y="440" class="body">Dense / BM25 / RRF</text>
  <text x="72" y="466" class="body">Rerank 分数与排名</text>
  <text x="72" y="500" class="small">Phase 2 对象，每一跳继续复用</text>

  <rect x="458" y="336" width="356" height="202" rx="18" fill="#f0eafb" filter="url(#shadow)"/>
  <text x="482" y="368" class="code">EvidenceDecision</text>
  <text x="482" y="400" class="body">verdict</text><text x="592" y="400" class="small">complete / continue / insufficient</text>
  <text x="482" y="426" class="body">requirement_assessments[]</text>
  <text x="482" y="452" class="body">next_query · next_requirement_id</text>
  <text x="482" y="478" class="body">reason · failure_reason</text>
  <text x="482" y="512" class="small">由 Grader 输出，再经过确定性 complete gate</text>
  <path d="M814 416 H896" class="arrow"/><path d="M458 454 H382" class="arrow"/>

  <rect x="900" y="344" width="332" height="186" rx="18" fill="#fff1dc" filter="url(#shadow)"/>
  <text x="924" y="376" class="code">HopTrace</text>
  <text x="924" y="408" class="body">hop_index · is_correction</text>
  <text x="924" y="434" class="body">query · hits[]</text>
  <text x="924" y="460" class="body">decision</text>
  <text x="924" y="486" class="body">elapsed_seconds · stage_calls</text>
  <path d="M900 434 H818" class="arrow"/>

  <rect x="286" y="590" width="708" height="82" rx="18" fill="#dff3e8" stroke="#6aa281" stroke-width="2" filter="url(#shadow)"/>
  <text x="316" y="623" class="code">AgenticRetrievalResult</text>
  <text x="316" y="650" class="body">question · route_decision · final_hits · traces · termination_reason · total_hops · correction_count</text>
  <path d="M636 538 V588" class="arrow"/><path d="M1066 530 V566 H836 V588" class="arrow"/><path d="M213 524 V566 H444 V588" class="arrow"/>
</svg>
