# Advanced RAG Phase 2 评测集。
# 所有可回答题均重新基于当前 data/raw 正文标注；evidence_contains 必须映射到实际 Chunk。
# dev 用于开发调试，test 仅用于最终验证。
questions:
  # BM25 / 精确词项：专有名词、缩写、命令和 API 名称。
  - {id: lexical-01, split: dev, category: lexical, question: "通用 Agent 常见的线性思考与行动循环叫什么？", answerable: true, relevant: [{source: "KDD Cup 2026 Data Agents", evidence_contains: "ReAct"}], expected_facts: ["ReAct", "Reasoning and Acting"]}
  - {id: lexical-02, split: dev, category: lexical, question: "预处理流程用什么对象统一呈现原始文件和本次生成文件？", answerable: true, relevant: [{source: "主 Agent 运行前预处理流程", evidence_contains: "ContextView"}], expected_facts: ["ContextView"]}
  - {id: lexical-03, split: dev, category: lexical, question: "过程校验证据包中保存可用证据的列表字段叫什么？", answerable: true, relevant: [{source: "队伍过程校验 Agent", evidence_contains: "evidence_items"}], expected_facts: ["evidence_items"]}
  - {id: lexical-04, split: dev, category: lexical, question: "APEX-SQL Schema Linking 最终表列集合使用哪个字段保存？", answerable: true, relevant: [{source: "APEX-SQLSchema Linking", evidence_contains: "refined_schema"}], expected_facts: ["refined_schema"]}
  - {id: lexical-05, split: dev, category: lexical, question: "视频 ASR 评测中，中文字符错误率的英文缩写是什么？", answerable: true, relevant: [{source: "视频理解 ASR 技术方案", evidence_contains: "Character Error Rate"}], expected_facts: ["CER", "Character Error Rate"]}
  - {id: lexical-06, split: dev, category: lexical, question: "H.264 说明中，显示时间和解码时间分别使用什么缩写？", answerable: true, relevant: [{source: "基于 H.264 码流的关键帧抽取", evidence_contains: "DTS"}], expected_facts: ["PTS", "DTS"]}
  - {id: lexical-07, split: dev, category: lexical, question: "操作系统用哪个英文缩写表示进程控制块？", answerable: true, relevant: [{source: "第二章--进程管理", evidence_contains: "PCB"}], expected_facts: ["PCB"]}
  - {id: lexical-08, split: dev, category: lexical, question: "Scrapy 中负责处理下载响应的回调方法叫什么？", answerable: true, relevant: [{source: "SCRAPY爬虫框架", evidence_contains: "parse()"}], expected_facts: ["parse()"]}
  - {id: lexical-09, split: test, category: lexical, question: "CMake 项目的主要配置文件叫什么？", answerable: true, relevant: [{source: "cmake-配置与基础", evidence_contains: "CMakeLists.txt文件用于配置CMake项目"}], expected_facts: ["CMakeLists.txt"]}
  - {id: lexical-10, split: test, category: lexical, question: "Flask 中根据端点名动态生成 URL 的函数叫什么？", answerable: true, relevant: [{source: "Flask框架的使用", evidence_contains: "url_for()函数可以根据访问连接动态生成URL"}], expected_facts: ["url_for()"]}
  - {id: lexical-11, split: test, category: lexical, question: "MySQL 分页查询使用哪个关键字？", answerable: true, relevant: [{source: "SQL语言", evidence_contains: "MySQL中是 `LIMIT`"}], expected_facts: ["LIMIT"]}
  - {id: lexical-12, split: test, category: lexical, question: "图遍历中，深度优先搜索的英文缩写是什么？", answerable: true, relevant: [{source: "数据结构-图", evidence_contains: "继续递归进行搜索"}], expected_facts: ["DFS"]}

  # Dense / 语义改写：问题避免直接复述证据原词。
  - {id: semantic-01, split: dev, category: semantic, question: "为什么不能让数据分析智能体直接阅读一张包含数百万行的完整表？", answerable: true, relevant: [{source: "KDD Cup 2026 Data Agents", evidence_contains: "一张表可能有几百万行"}], expected_facts: ["超过 Token 限制", "注意力分散"]}
  - {id: semantic-02, split: dev, category: semantic, question: "为什么主模型推理前要先对任务材料进行程序化准备？", answerable: true, relevant: [{source: "主 Agent 运行前预处理流程", evidence_contains: "工具选择成本高"}], expected_facts: ["降低工具选择成本", "统一上下文格式", "便于复查"]}
  - {id: semantic-03, split: dev, category: semantic, question: "证据包里出现失败查询或截断文档时，为什么不能立即判定候选结论无效？", answerable: true, relevant: [{source: "队伍过程校验 Agent", evidence_contains: "排除项不会自动导致 `valid=false`"}], expected_facts: ["排除项不自动导致拒绝", "只有缺少结论必需证据才拒绝"]}
