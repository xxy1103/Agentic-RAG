  - {id: evidence-09, split: test, category: multi_evidence, question: "用户级线程和内核级线程在切换开销、阻塞影响和多核并行方面有什么差异？", answerable: true, relevant: [{source: "第二章--进程管理", evidence_contains: "用户级线程的切换在用户空间"}, {source: "第二章--进程管理", evidence_contains: "一个线程被阻塞后，别的线程还可以继续执行"}], expected_facts: ["用户级线程切换开销低", "用户线程阻塞可能阻塞整个进程", "内核线程可多核并行", "内核切换开销高"]}
  - {id: evidence-10, split: test, category: multi_evidence, question: "TCP 的 AIMD 如何调整拥塞状态下的发送行为，窗口与实际发送速率又有什么关系？", answerable: true, relevant: [{source: "计算机网络第6章--传输层", evidence_contains: "加性增加"}, {source: "计算机网络第6章--传输层", evidence_contains: "乘性减少"}, {source: "计算机网络第6章--传输层", evidence_contains: "W/RTT"}], expected_facts: ["无拥塞时缓慢增加", "拥塞时快速减小", "发送速率约为 W/RTT"]}
  - {id: evidence-11, split: test, category: multi_evidence, question: "SQL 分组查询中 WHERE 和 HAVING 的过滤时机有什么不同？", answerable: true, relevant: [{source: "SQL语言", evidence_contains: "where是分组之前进行过滤"}, {source: "SQL语言", evidence_contains: "having是分组之后对结果进行过滤"}], expected_facts: ["WHERE 在分组前过滤", "HAVING 在分组后过滤"]}
  - {id: evidence-12, split: test, category: multi_evidence, question: "Spring 如何处理无法直接添加组件注解的第三方类，自定义 Starter 又提供哪两类能力？", answerable: true, relevant: [{source: "Spring-Boot原理篇", evidence_contains: "使用 `@Bean` 注解手动注册"}, {source: "Spring-Boot原理篇", evidence_contains: "依赖管理功能"}, {source: "Spring-Boot原理篇", evidence_contains: "自动配置功能"}], expected_facts: ["用 @Bean 手动注册第三方类", "Starter 提供依赖管理", "Starter 提供自动配置"]}

