  - {id: evidence-05, split: dev, category: multi_evidence, question: "ASR 方案如何分工完成语言识别、正式转写和专业词修正？", answerable: true, relevant: [{source: "视频理解 ASR 技术方案", evidence_contains: "faster-whisper tiny"}, {source: "视频理解 ASR 技术方案", evidence_contains: "faster-whisper medium"}, {source: "视频理解 ASR 技术方案", evidence_contains: "initial_prompt"}], expected_facts: ["tiny 检测语言", "medium 正式转写", "initial_prompt 引导专业词"]}
  - {id: evidence-06, split: dev, category: multi_evidence, question: "基于 H.264 码流的方案如何从变化信号得到最终代表帧？", answerable: true, relevant: [{source: "基于 H.264 码流的关键帧抽取", evidence_contains: "packet 大小检测变化候选"}, {source: "基于 H.264 码流的关键帧抽取", evidence_contains: "把连续突变聚成 burst"}, {source: "基于 H.264 码流的关键帧抽取", evidence_contains: "画面稳定后解码一张代表帧"}], expected_facts: ["检测 packet 大小异常", "聚合连续 burst", "过滤孤立 I 帧", "稳定后取代表帧"]}
  - {id: evidence-07, split: dev, category: multi_evidence, question: "APEX-SQL Schema Linking 的局部探索循环和全局细化循环分别解决什么问题？", answerable: true, relevant: [{source: "APEX-SQLSchema Linking", evidence_contains: "逐表探索循环"}, {source: "APEX-SQLSchema Linking", evidence_contains: "全局细化循环"}], expected_facts: ["局部循环判断单表实际语义和用途", "全局循环检查字段完整性和可连接性"]}
