  - {id: evidence-06, category: multi_evidence, question: "两种表筛选方案如何分别压缩主模型的初始输入，以及通过局部探索和全局检查形成可用于查询的表列集合？", answerable: true, relevant: [{source: "KDD Cup 2026 Champion结构化表相关性判定agent_20260812204352.md", section: "1. 这个 Agent 解决什么问题", evidence_contains: "表级 Schema 压缩器"}, {source: "APEX-SQLSchema Linking 的规划、探索与全局细化_20260823162235.md", section: "2. 整体算法：先缩小搜索空间，再从局部走向全局", evidence_contains: "逐表探索循环"}, {source: "APEX-SQLSchema Linking 的规划、探索与全局细化_20260823162235.md", section: "2. 整体算法：先缩小搜索空间，再从局部走向全局", evidence_contains: "全局细化循环"}], expected_facts: ["表相关性模块折叠低相关表的 Schema 以压缩初始 Prompt", "局部循环验证单表字段语义和用途", "全局循环补齐字段与连接路径"]}
