  - {id: semantic-10, split: dev, category: semantic, question: "页号在快表中命中时，为什么访问逻辑地址只需要一次访存？", answerable: true, relevant: [{source: "内存管理", evidence_contains: "若快表命中"}], expected_facts: ["快表已有页表项副本", "无需再访问内存中的页表"]}
  - {id: semantic-11, split: dev, category: semantic, question: "数据库索引为什么会加快读取，却可能拖慢数据写入？", answerable: true, relevant: [{source: "SQL语言", evidence_contains: "维护索引"}], expected_facts: ["减少扫描和 I/O", "写入时需要维护额外索引结构"]}
  - {id: semantic-12, split: test, category: semantic, question: "进程和线程分别承担哪一种系统基本职责？", answerable: true, relevant: [{source: "第二章--进程管理", evidence_contains: "资源分配的基本单位"}, {source: "第二章--进程管理", evidence_contains: "CPU调度的基本单位"}], expected_facts: ["进程是资源分配基本单位", "线程是 CPU 调度基本单位"]}
  - {id: semantic-13, split: test, category: semantic, question: "为什么边很少的图更适合链式邻接结构，而边很多时更适合矩阵？", answerable: true, relevant: [{source: "数据结构-图", evidence_contains: "邻接矩阵多用于稠密图；而邻接表多用于稀疏图"}], expected_facts: ["邻接表只存实际相邻节点", "邻接矩阵适合稠密图"]}
  - {id: semantic-14, split: test, category: semantic, question: "在 C++ 构建流程中，CMake、Ninja 和 GCC 分别负责什么？", answerable: true, relevant: [{source: "cmake-配置与基础", evidence_contains: "CMake (设计师/项目经理)"}, {source: "cmake-配置与基础", evidence_contains: "Ninja (施工队长/执行者)"}, {source: "cmake-配置与基础", evidence_contains: "GCC (工人/建造师)"}], expected_facts: ["CMake 生成构建文件", "Ninja 组织构建", "GCC 编译源代码"]}
  - {id: semantic-15, split: test, category: semantic, question: "Scrapy 的请求处理为什么不会因为等待某个服务器响应而停住整个爬虫？", answerable: true, relevant: [{source: "SCRAPY爬虫框架", evidence_contains: "无需因等待响应而阻塞"}], expected_facts: ["请求异步调度和处理", "等待期间可发送其他请求"]}
  - {id: semantic-16, split: test, category: semantic, question: "Spring Boot 起步依赖为什么能降低依赖管理成本？", answerable: true, relevant: [{source: "Spring-Boot原理篇", evidence_contains: "不必再担心库版本"}], expected_facts: ["按功能引入依赖", "传递依赖版本兼容", "减少逐库声明"]}

  # Hybrid/RRF/Rerank / 多证据：答案需要组合两条或更多证据。
  - {id: evidence-01, split: dev, category: multi_evidence, question: "KDD Data Agent 从拆解任务到形成最终答案，需要完成哪些核心环节？", answerable: true, relevant: [{source: "KDD Cup 2026 Data Agents", evidence_contains: "任务分解与规划"}, {source: "KDD Cup 2026 Data Agents", evidence_contains: "工具选择与调用"}, {source: "KDD Cup 2026 Data Agents", evidence_contains: "异构数据推理"}, {source: "KDD Cup 2026 Data Agents", evidence_contains: "结果综合"}], expected_facts: ["任务分解", "工具调用", "异构数据推理", "结果综合"]}
  - {id: evidence-02, split: dev, category: multi_evidence, question: "主 Agent 启动前，系统如何分别统一非结构化材料和结构化数据的访问入口？", answerable: true, relevant: [{source: "主 Agent 运行前预处理流程", evidence_contains: "统一组织为 `ContextView`"}, {source: "主 Agent 运行前预处理流程", evidence_contains: "DuckDB 内存逻辑表"}], expected_facts: ["用 ContextView 统一文件和生成材料", "用 DuckDB 统一 CSV、JSON、SQLite 查询"]}
