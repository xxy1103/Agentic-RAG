  - {id: evidence-08, category: multi_evidence, question: "数据链路层怎样利用确认、定时器和序列号避免帧丢失或重复交付？", answerable: true, relevant: [{source: "计算机网络第三章--数据链路层_20250315_094457.md", section: "Error control: correction and detection纠错与检错", evidence_contains: "* 接收方向发送方提供**反馈(feedback)**，**确认消息(ACK)**"}, {source: "计算机网络第三章--数据链路层_20250315_094457.md", section: "Error control: correction and detection纠错与检错", evidence_contains: "* 由于硬件故障可能导致帧完全丢失，当帧确认消息丢失时，**定时器(timer)**会超时"}, {source: "计算机网络第三章--数据链路层_20250315_094457.md", section: "Error control: correction and detection纠错与检错", evidence_contains: "* **定时器(timer)**和**序列号(sequence number)**，保证每个帧恰好被传递到目的地的网络层一次。"}], expected_facts: ["ACK 提供反馈", "超时触发恢复", "序列号避免重复交付"]}
  - {id: evidence-09, category: multi_evidence, question: "用户级线程和内核级线程在切换开销、阻塞影响和多核并行方面有什么差异？", answerable: true, relevant: [{source: "第二章--进程管理_20251024_143751.md", section: "用户级线程(User-Level Thread, UTL)", evidence_contains: "* 用户级线程的切换在用户空间即可完成，不需要切换到核心态，线程管理的系统开销小，效率高。"}, {source: "第二章--进程管理_20251024_143751.md", section: "内核级线程", evidence_contains: "* 当一个线程被阻塞后，别的线程还可以继续执行，并发能力强。多线程可在多核处理器上并行执行"}], expected_facts: ["用户级线程切换开销低", "用户线程阻塞可能阻塞整个进程", "内核线程可多核并行", "内核切换开销高"]}
  - {id: evidence-10, category: multi_evidence, question: "TCP 的 AIMD 如何调整拥塞状态下的发送行为，窗口与实际发送速率又有什么关系？", answerable: true, relevant: [{source: "计算机网络第6章--传输层_20250527_102317.md", section: "AIMD Control Law", evidence_contains: "* 加性增加：在网络没有拥塞时，缓慢的增加发送速率，以充分利用可用带宽。"}, {source: "计算机网络第6章--传输层_20250527_102317.md", section: "AIMD Control Law", evidence_contains: "* 乘性减少：当检测到拥塞时，迅速的减小发送速率，以免网络过载。"}, {source: "计算机网络第6章--传输层_20250527_102317.md", section: "AIMD is Used by TCP", evidence_contains: "W/RTT"}], expected_facts: ["无拥塞时缓慢增加", "拥塞时快速减小", "发送速率约为 W/RTT"]}
  - {id: evidence-11, category: multi_evidence, question: "SQL 分组查询中 WHERE 和 HAVING 的过滤时机有什么不同？", answerable: true, relevant: [{source: "SQL语言_20250807_153153.md", section: "分组查询", evidence_contains: "where是分组之前进行过滤"}, {source: "SQL语言_20250807_153153.md", section: "分组查询", evidence_contains: "having是分组之后对结果进行过滤"}], expected_facts: ["WHERE 在分组前过滤", "HAVING 在分组后过滤"]}
  - {id: evidence-12, category: multi_evidence, question: "Spring 如何处理无法直接添加组件注解的第三方类，自定义 Starter 又提供哪两类能力？", answerable: true, relevant: [{source: "Spring-Boot原理篇_20250903_094556.md", section: "第三方bean", evidence_contains: "使用 `@Bean` 注解手动注册"}, {source: "Spring-Boot原理篇_20250903_094556.md", section: "自定义Starter", evidence_contains: "依赖管理功能"}, {source: "Spring-Boot原理篇_20250903_094556.md", section: "自定义Starter", evidence_contains: "* **自动配置功能**(auto-configuration)：基于条件注解自动装配Bean。"}], expected_facts: ["用 @Bean 手动注册第三方类", "Starter 提供依赖管理", "Starter 提供自动配置"]}

