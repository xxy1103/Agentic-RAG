  - {id: semantic-05, split: dev, category: semantic, question: "稳定帧判断为什么同时检查一个采样点进入前和离开后的画面变化？", answerable: true, relevant: [{source: "IDMG123队伍视频理解方案", evidence_contains: "前后两次画面变化都低于阈值"}], expected_facts: ["双侧安静", "避免把转场中的单帧当作稳定画面"]}
  - {id: semantic-06, split: dev, category: semantic, question: "正式语音转写为什么选择 medium，而不是一味使用更大的 large-v3？", answerable: true, relevant: [{source: "视频理解 ASR 技术方案", evidence_contains: "末尾幻觉显著少于 large-v3"}], expected_facts: ["正文识别能力足够", "末尾幻觉更少", "可用 Prompt 修复同音字"]}
  - {id: semantic-07, split: dev, category: semantic, question: "为什么视频码流中的一个超大 I 帧不能单独证明页面发生了重要变化？", answerable: true, relevant: [{source: "基于 H.264 码流的关键帧抽取", evidence_contains: "编码器周期性插入的 I 帧"}], expected_facts: ["I 帧可能由编码器周期性插入", "需要结合连续变化区域"]}
  - {id: semantic-08, split: dev, category: semantic, question: "Schema Linking 为什么要执行探索 SQL，而不能只根据字段名称判断相关性？", answerable: true, relevant: [{source: "APEX-SQLSchema Linking", evidence_contains: "生成 3～8 条 Snowflake 探索 SQL"}], expected_facts: ["验证字段真实语义", "确认粒度和范围", "检查连接与数据质量"]}
